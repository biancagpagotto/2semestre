<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Pedidos Quitanda</title>
</head>
<body>
    <center>
    <h1>Novo pedido</h1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identificação" name="id" required><br><br>
            <input type="text" placeholder="Nome do produto" name="nome" required><br><br>
            <select type="text" placeholder="Unidade" name="unidade" required>
                <option value="Kg">Kg</option>
                <option value="Unidade">Unidade</option>
            </select><br><br>
            <input type="number" step="0.01" placeholder="Preço unitário" name="precoUnitario" required><br><br>
            <input type="number" placeholder="Quantidade do produto" name="quantidade" required><br><br>
            <button type ="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
