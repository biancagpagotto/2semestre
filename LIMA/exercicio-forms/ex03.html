<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais</legend>
            <label>Nome:</label>
            <input type="text">
            <br><br>
            <label>Endereço:</label>
            <input type="text">
            <br><br>
            <label>Cidade:</label>
            <input type="text">
            <br><br>
            <label>Estado:</label>
            <select>
                <option>São Paulo</option>
                <option>Rio de Janeiro</option>
                <option>Minas Gerais</option>
                <option>Paraná</option>
            </select>
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados profissionais</legend>
            <label>Natureza do Cargo</label>
            <br>
            <input type="radio" name="cargo" checked/>
            <label>Gerência</label>
            <input type="radio" name="cargo"/>
            <label>Financeiro</label>
            <input type="radio" name="cargo"/>
            <label>Recepção</label>
            <input type="radio" name="cargo"/>
            <label>Administrativo</label>
            <input type="radio" name="cargo"/>
            <label>Jurídico</label>
            <br><br>
            <label>Área de interesse</label>
            <br>
            <input type="checkbox"/>
            <label>Computação</label>
            <input type="checkbox"/>
            <label>Biologia</label>
            <input type="checkbox"/>
            <label>Meio Ambiente</label>
            <input type="checkbox"/>
            <label>Engenharia</label>
            <input type="checkbox"/>
            <label>História</label>
            <br><br>
            <label>Mini-currículo:</label>
            <textarea rows="5" cols="40"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Enviar"/>
        <input type="reset" value="Limpar"/>
    </form>
</body>
</html>
