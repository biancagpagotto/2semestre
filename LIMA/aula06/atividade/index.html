<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Cadastro</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="container">

            <div class="card">
                <h1>Cadastro de aluno</h1>
                <p>Preencha os dados abaixo</p>

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome"
                >
                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                >
                <input
                    type="tel"
                    id="matricula"
                    placeholder="Matricula"
                >
                <button id="salvar">
                    Salvar
                </button>
            </div>

            <div class="card tabela-container">
                <h2>Cadastros de aluno</h2>
                <table>
                    
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Matricula</th>
                        </tr>
                    </thead>

                    <tbody id="tabela">

                    </tbody>

                </table>
            </div>

            <div class="card">
                <h1>Cadastro de Professor</h1>
                <p>Preencha os dados abaixo</p>

                <input
                    type="text"
                    id="nomeProfessor"
                    placeholder="Nome"
                >
                <input
                    type="email"
                    id="emailProfessor"
                    placeholder="E-mail"
                >
                <input
                    type="text"
                    id="disciplina"
                    placeholder="Disciplina"
                >
                <button id="salvarProfessor">
                    Salvar
                </button>
            </div>

            <div class="card tabela-container">
                <h2>Professores</h2>
                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Disciplina</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaProfessor">

                    </tbody>
                    
                </table>
            </div>

        </main>
        <script src="script.js"></script>

    </body>
</html>
